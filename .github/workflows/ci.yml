name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck, Test, Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage (global threshold gate runs at root)
        run: npm run test:coverage

      - name: Build all workspaces
        run: npm run build

      - name: Dispatcher smoke (top-level)
        run: node ./bin/metaswarm-dashboard --help

      - name: Dispatcher smoke — collect
        run: node ./bin/metaswarm-dashboard collect --help

      - name: Dispatcher smoke — serve
        run: node ./bin/metaswarm-dashboard serve --help

      - name: Dispatcher smoke — config init
        run: node ./bin/metaswarm-dashboard config init --help

  shellcheck:
    name: ShellCheck bin/*.sh (ubuntu only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          if compgen -G "bin/*.sh" > /dev/null; then
            sudo apt-get install -y shellcheck
            shellcheck bin/*.sh
          else
            echo "No bin/*.sh files found, skipping."
          fi
